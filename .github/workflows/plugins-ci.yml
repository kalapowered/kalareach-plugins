name: plugins-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  catalogue:
    name: catalogue
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Validate every package
        run: cargo run --locked -p kalareach-catalogue -- validate

      - name: Verify the development generation
        run: cargo run --locked -p kalareach-catalogue -- verify snapshots/development

      - name: Measure a ten thousand entry catalogue
        run: cargo run --locked --release -p kalareach-catalogue -- bench --entries 10000
