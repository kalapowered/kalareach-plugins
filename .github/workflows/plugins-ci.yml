name: plugins-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push is read from the commit it replaced, so a push run that a later push cancelled would leave
# its commits unread by `records`: each push run has a group of its own (two pushes can even carry
# the same head commit). A pull request or a manual run still replaces an earlier run on the same
# ref.
concurrency:
  group: plugins-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  catalogue:
    name: catalogue
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The .gitignore keeps the assistant instruction names out of every commit: each name is
      # created in a repository holding only the committed .gitignore and git check-ignore has to
      # name it ignored. The check is put through a planted fault before it is trusted with the tree.
      - name: Prove the .gitignore ignores the local workspace names
        run: |
          scripts/check-local-names.sh --self-test
          scripts/check-local-names.sh

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Signing keys live outside the repository, so the run makes a set of its own outside the
      # checkout. The pipeline refuses to sign if it finds a private key inside the tree, and that
      # check runs here on the real tree rather than only on a temporary one.
      - name: Generate development signing keys
        run: |
          set -euo pipefail
          signing="$RUNNER_TEMP/kalareach-signing"
          scripts/generate-development-keys.sh "$signing"
          echo "KALAREACH_SIGNING_DIR=$signing" >> "$GITHUB_ENV"

      - name: Write the trust root
        run: cargo run --locked -p kalareach-catalogue -- root --signing-dir "$KALAREACH_SIGNING_DIR"

      - name: Test
        run: cargo test --locked

      - name: Validate every package
        run: cargo run --locked -p kalareach-catalogue -- validate

      - name: Build and verify a generation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generation"
          cargo run --locked -p kalareach-catalogue -- build \
            --signing-dir "$KALAREACH_SIGNING_DIR" --out "$out" --generation 2
          cargo run --locked -p kalareach-catalogue -- verify "$out"

      - name: Verify the development generation
        run: cargo run --locked -p kalareach-catalogue -- verify snapshots/development

      - name: Measure a ten thousand entry catalogue
        run: cargo run --locked --release -p kalareach-catalogue -- bench --entries 10000

  # KR-GOAL-32: the commits being sent, and the files each published package carries, hold no
  # local-only record, credential or build-agent instruction file, including one added in a commit
  # and deleted in a later commit of the same push. The history comes whole because a push names
  # the commit it replaced and a pull request the branch it merges into.
  #
  # KR-REQ-04.18: the catalogue consumes the core repository's SDK at one revision that a package
  # release was packed from, through no path dependency.
  records:
    name: outgoing records and the core pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the whole history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Test the refusals
        run: |
          python3 -I scripts/check-outgoing-records.py self-test
          python3 -I scripts/check-core-pin.py self-test

      - name: Check the commits and the packages
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: >-
          python3 -I scripts/check-outgoing-records.py check
          --package-dir 'plugins/*/*'
          --package-dir 'snapshots/development/targets/packages/*/*/*'

      - name: Hold the core dependency to a release
        run: python3 -I scripts/check-core-pin.py check

  # Every crate in Cargo.lock, checked against the RustSec advisory database as it stands when this
  # job runs. .cargo/audit.toml says what fails the check. The checker is one release, and its
  # archive has to match the digest here before it runs; it and the database are public downloads,
  # so the job needs no credential. It is a job of its own, so an advisory published since the last
  # run fails this job without hiding any other result.
  advisories:
    name: dependencies against the RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dependencies against the RustSec advisories
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
        run: |
          set -euo pipefail
          release="cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION"
          tag="cargo-audit%2Fv$CARGO_AUDIT_VERSION"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$release.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/$tag/$release.tgz"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$release.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$release.tgz" --directory "$RUNNER_TEMP"
          status=0
          "$RUNNER_TEMP/$release/cargo-audit" audit || status=$?
          # Which state of the database this run was judged against, pass or fail. `cargo audit`
          # keeps it in the Cargo home.
          git -C "${CARGO_HOME:-$HOME/.cargo}/advisory-db" log -1 \
            --format="advisory database at %H (%cI)" || true
          exit "$status"
